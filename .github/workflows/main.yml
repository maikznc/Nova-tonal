# Baut die Plugins auf einem Mac in der GitHub-Cloud.
# Ergebnis: Installer (.pkg) + ZIP mit VST3 und AU – unter "Actions" beim jeweiligen Lauf
# (Abschnitt "Artifacts") bzw. bei Versionen (Tag v…) unter "Releases".

name: Mac-Plugins bauen

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write   # nötig, um bei Tags ein Release anzulegen

jobs:
  macos:
    name: VST3 + AU (Apple Silicon + Intel)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMS_BUILD_TESTS=ON

      - name: Bauen
        run: cmake --build build --config Release --target TonalBalance_VST3 TonalBalance_AU MSTests -j 4

      - name: Tests
        run: ./build/tests/MSTests_artefacts/Release/MSTests

      - name: Plugins prüfen (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          "$PV" --strictness-level 10 --skip-gui-tests --timeout-ms 300000 \
                --validate "build/plugins/TonalBalance/TonalBalance_artefacts/Release/VST3/NOVA Leitstern.vst3"
          killall -9 AudioComponentRegistrar 2>/dev/null || true   # AU-Liste neu einlesen
          "$PV" --strictness-level 10 --skip-gui-tests --timeout-ms 300000 \
                --validate "$HOME/Library/Audio/Plug-Ins/Components/NOVA Leitstern.component"

      - name: Signieren und Installer bauen
        run: bash scripts/package-macos.sh

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Leitstern-macOS
          path: dist/*
          if-no-files-found: error

      - name: Release anlegen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
